<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#163B2B">
<title>341 农业知识综合三 · 江西农业大学考研学习站</title>
<meta name="description" content="江西农业大学 341 农业知识综合三（C语言程序设计、农业机械与装备、数据库技术与应用）考研学习站：章节考点、名词解释、历年真题、自测练习，零基础快速上岸。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" onerror="(function(){var s=document.createElement('script');s.src='https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js';s.onload=function(){window.__redraw&&window.__redraw()};document.head.appendChild(s)})()"></script>
</head>
<body>
<div id="app">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 100 100"><path d="M50 8 L92 30 L50 52 L8 30 Z" fill="#4C8C6A"/><path d="M8 30 L50 52 L50 92 L8 70 Z" fill="#2E6B4F"/><path d="M92 30 L50 52 L50 92 L92 70 Z" fill="#3E6B8C"/><path d="M50 52 L74 62 L50 72 L26 62 Z" fill="#C9963D"/></svg>
        <div>
          <h1>341 农业知识综合三</h1>
          <p>江西农业大学 · 27 考研学习站</p>
        </div>
      </div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="foot">
      <div>学习进度</div>
      <div class="bar"><i id="progBar"></i></div>
      <div id="progTxt">已完成 0 章</div>
    </div>
  </aside>
  <div class="mask" id="mask"></div>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h2 id="topTitle">首页</h2>
      <span class="crumb" id="topCrumb"></span>
      <div class="right">
        <span class="chip" id="todayChip"></span>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- 移动端底部导航 -->
<nav class="tabbar" id="tabbar"></nav>
<button class="fab" id="fab" aria-label="回到顶部" style="display:none;position:fixed;right:18px;bottom:80px;width:44px;height:44px;border-radius:50%;background:var(--green-700);color:#fff;box-shadow:0 4px 14px rgba(30,77,58,.3);z-index:60">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="data/clang.js"></script>
<script src="data/agmech.js"></script>
<script src="data/db.js"></script>
<script src="data/exams.js"></script>
<script src="data/quiz.js"></script>
<script src="data/terms.js"></script>
<script src="data/media.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script>
/* 日期与倒计时 */
(function(){
  var t=new Date();
  var days=Math.ceil((new Date(2026,11,19)-t)/864e5);
  var el=document.getElementById("todayChip");
  if(el)el.textContent=(t.getMonth()+1)+"月"+t.getDate()+"日 · "+(days>0?"距考研 "+days+" 天":"考研进行中 · 加油！");
})();
</script>
</body>
</html>
